<header class="topbar">
  <div class="topbar-left">
    <button class="tb-menu" (click)="onToggleSidebar()">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M1 3h13M1 7.5h13M1 12h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="breadcrumb">
      <span class="bc-root">SICAM</span>
      <span class="bc-sep">›</span>
      <span class="bc-current">{{ pageTitle() }}</span>
    </div>
  </div>

  <div class="topbar-right">
    <div class="tb-btn">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M7.5 1a5 5 0 00-5 5v3l-1 2h12l-1-2V6a5 5 0 00-5-5zM6 11.5a1.5 1.5 0 003 0"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tb-divider"></div>
    <div class="tb-user">
      <div class="tb-avatar">
        {{ authService.currentUser()?.fullName?.charAt(0) ?? 'U' }}
      </div>
      <span class="tb-username">
        {{ authService.currentUser()?.fullName ?? 'Usuario' }}
      </span>
    </div>
    <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M6 2H3a1 1 0 00-1 1v9a1 1 0 001 1h3M10 10l3-3-3-3M13 7H6"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>
