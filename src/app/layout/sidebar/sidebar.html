<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="sb-header">
    <div class="sb-logo">S</div>
    @if (!collapsed()) {
      <span class="sb-brand">SICAM</span>
    }
  </div>

  <nav class="sb-nav">
    @for (item of items; track item.route; let i = $index) {
      @if (getSection(i)) {
        @if (!collapsed()) {
          <div class="sb-section">{{ getSection(i) }}</div>
        }
      }
      <a class="nav-item"
         [routerLink]="item.route"
         routerLinkActive="active"
         [title]="collapsed() ? item.label : ''">
        <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
        @if (!collapsed()) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <div class="sb-footer">
  <div class="user-card">
    <div class="ua">{{ userInitials }}</div>
    @if (!collapsed()) {
      <div class="ud">
        <span class="un">{{ userName }}</span>
        <span class="ue">{{ userEmail }}</span>
      </div>
    }
  </div>
</div>
</aside>
