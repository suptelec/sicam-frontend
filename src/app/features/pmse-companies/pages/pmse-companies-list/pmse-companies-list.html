<section class="page">
  <app-page-header
    eyebrow="Administración"
    title="Empresas PMSE"
    description="Participantes Mayoristas del Sector Eléctrico registrados en SICAM."
    actionText="Nueva empresa"
    actionIcon="add"
    (actionClicked)="drawerOpen.set(true)"
  />

  <app-search-toolbar
    [(value)]="searchTerm"
    placeholder="Buscar por nombre, RUC o código CENACE..."
    [loading]="isLoading()"
    (search)="onSearch()"
    (refresh)="load()"
  />

  <app-table-card
    [loading]="isLoading()"
    [empty]="dataSource.data.length === 0"
    loadingText="Cargando empresas PMSE..."
    emptyIcon="business"
    emptyTitle="No hay empresas registradas"
    emptyDescription="Crea una empresa PMSE para iniciar la gestión dentro de SICAM."
    emptyActionText="Crear empresa"
    emptyActionIcon="add"
    (emptyActionClicked)="drawerOpen.set(true)"
  >
    <table
      table-content
      mat-table
      [dataSource]="dataSource"
      class="companies-table"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Empresa</th>

        <td mat-cell *matCellDef="let row">
          <div class="company-name">
            <div class="company-name__avatar">
              <mat-icon>business</mat-icon>
            </div>

            <div>
              <strong>{{ row.name }}</strong>
              <span>ID interno: {{ row.id }}</span>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="externalCode">
        <th mat-header-cell *matHeaderCellDef>Código CENACE</th>

        <td mat-cell *matCellDef="let row">
          <code class="code-pill">{{ row.externalCode }}</code>
        </td>
      </ng-container>

      <ng-container matColumnDef="ruc">
        <th mat-header-cell *matHeaderCellDef>RUC</th>

        <td mat-cell *matCellDef="let row">
          {{ row.ruc }}
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>

        <td mat-cell *matCellDef="let row">
          <span class="badge badge-type">
            {{ getTypeLabel(row.type) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="region">
        <th mat-header-cell *matHeaderCellDef>Región</th>

        <td mat-cell *matCellDef="let row">
          <span class="badge badge-region">
            {{ getRegionLabel(row.region) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>

        <td mat-cell *matCellDef="let row">
          @let chip = getEntityStatusChip(row.status);

          <app-status-chip
            [label]="chip.label"
            [tone]="chip.tone"
            [icon]="chip.icon ?? null"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>

        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button
            mat-icon-button
            type="button"
            [matTooltip]="row.status === EntityStatus.Active ? 'Inactivar' : 'Activar'"
            (click)="onToggleStatus(row)"
          >
            <mat-icon
              [class.action-danger]="row.status === EntityStatus.Active"
              [class.action-success]="row.status !== EntityStatus.Active"
            >
              {{ row.status === EntityStatus.Active ? 'block' : 'check_circle' }}
            </mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      table-footer
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      showFirstLastButtons
    />
  </app-table-card>
</section>

@if (drawerOpen()) {
  <app-pmse-company-drawer
    (created)="onCompanyCreated()"
    (closed)="drawerOpen.set(false)"
  />
}
