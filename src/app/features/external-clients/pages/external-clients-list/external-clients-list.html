<section class="page">
  <app-page-header
    eyebrow="Administración"
    title="Clientes externos M2M"
    description="Gestiona aplicaciones externas que consumen los servicios de SICAM mediante client credentials."
    actionText="Nuevo cliente"
    actionIcon="add"
    (actionClicked)="openDrawer()"
  />

  <app-search-toolbar
    [(value)]="searchTerm"
    placeholder="Buscar por nombre, email o Client ID..."
    [loading]="loading"
    (search)="onSearch()"
    (refresh)="load()"
  />

  <app-table-card
    [loading]="loading"
    [empty]="clients.length === 0"
    loadingText="Cargando clientes externos..."
    emptyIcon="hub"
    emptyTitle="No hay clientes externos registrados"
    emptyDescription="Crea un cliente M2M para permitir que un sistema externo consuma los servicios de SICAM."
    emptyActionText="Crear cliente externo"
    emptyActionIcon="add"
    (emptyActionClicked)="openDrawer()"
  >
    <table
      table-content
      mat-table
      [dataSource]="clients"
      class="clients-table"
    >
      <ng-container matColumnDef="displayName">
        <th mat-header-cell *matHeaderCellDef>Sistema</th>

        <td mat-cell *matCellDef="let client">
          <div class="client-name">
            <div class="client-name__avatar">
              <mat-icon>dns</mat-icon>
            </div>

            <div>
              <strong>{{ client.displayName }}</strong>
              <span>ID interno: {{ client.id }}</span>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="clientId">
        <th mat-header-cell *matHeaderCellDef>Client ID</th>

        <td mat-cell *matCellDef="let client">
          <button
            class="client-id"
            type="button"
            matTooltip="Copiar Client ID"
            (click)="copy(client.clientId)"
          >
            <code>{{ client.clientId }}</code>
            <mat-icon>content_copy</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="contactEmail">
        <th mat-header-cell *matHeaderCellDef>Contacto</th>

        <td mat-cell *matCellDef="let client">
          <span class="email">{{ client.contactEmail }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>

        <td mat-cell *matCellDef="let client">
          @let chip = getEntityStatusChip(client.status);

          <app-status-chip
            [label]="chip.label"
            [tone]="chip.tone"
            [icon]="chip.icon ?? null"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>

        <td mat-cell *matCellDef="let client" class="actions-cell">
          <button
            mat-icon-button
            color="warn"
            type="button"
            matTooltip="Revocar cliente"
            (click)="revoke(client)"
          >
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      table-footer
      [length]="totalRecords"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)"
    />
  </app-table-card>
</section>

<app-drawer-shell
  [open]="drawerOpen"
  width="480px"
  (closed)="closeDrawer()">
  <app-create-client-drawer
    (closed)="closeDrawer()"
    (created)="onClientCreated()"
  />
</app-drawer-shell>
