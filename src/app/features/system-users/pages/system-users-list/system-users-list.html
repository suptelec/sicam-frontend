<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Usuarios del sistema</h1>
      <p class="page-sub">Gestión de usuarios CENACE y PMSE</p>
    </div>
    <button mat-raised-button color="primary" (click)="drawerOpen.set(true)">
      <mat-icon>add</mat-icon>
      Nuevo usuario
    </button>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <mat-icon class="search-icon">search</mat-icon>
      <input class="search-input"
             placeholder="Buscar por nombre o email..."
             [(ngModel)]="searchTerm"
             (keyup.enter)="onSearch()">
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" style="width:100%">

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.fullName }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let row">
          <span class="badge" [ngClass]="getUserTypeBadgeClass(row.type)">
            {{ getUserTypeLabel(row.type) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef>Empresa</th>
        <td mat-cell *matCellDef="let row">
          {{ row.pmseCompany ?? '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button matTooltip="Ver detalle">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      @if (!isLoading() && dataSource.data.length === 0) {
        <tr class="mat-row">
          <td [attr.colspan]="displayedColumns.length" class="no-data">
            No hay usuarios registrados
          </td>
        </tr>
      }
    </table>

    <mat-paginator
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>

@if (drawerOpen()) {
  <app-create-user-drawer
    (created)="onUserCreated()"
    (closed)="drawerOpen.set(false)" />
}
