<section class="page">
  <app-page-header
    eyebrow="Administración"
    title="Usuarios del sistema"
    description="Gestiona usuarios CENACE, administradores PMSE y operadores PMSE."
    actionText="Nuevo usuario"
    actionIcon="add"
    (actionClicked)="drawerOpen.set(true)"
  />

  <app-search-toolbar
    [(value)]="searchTerm"
    placeholder="Buscar por nombre o email..."
    [loading]="isLoading()"
    (search)="onSearch()"
    (refresh)="load()"
  />

  <app-table-card
    [loading]="isLoading()"
    [empty]="dataSource.data.length === 0"
    loadingText="Cargando usuarios..."
    emptyIcon="group"
    emptyTitle="No hay usuarios registrados"
    emptyDescription="Crea un usuario CENACE o PMSE para administrar el acceso al sistema."
    emptyActionText="Crear usuario"
    emptyActionIcon="add"
    (emptyActionClicked)="drawerOpen.set(true)"
  >
    <table
      table-content
      mat-table
      [dataSource]="dataSource"
      class="users-table"
    >
      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>

        <td mat-cell *matCellDef="let row">
          <div class="user-name">
            <div class="user-name__avatar">
              <mat-icon>person</mat-icon>
            </div>

            <div>
              <strong>{{ row.fullName }}</strong>
              <span>{{ row.email }}</span>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>

        <td mat-cell *matCellDef="let row">
          <span class="email">{{ row.email }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>

        <td mat-cell *matCellDef="let row">
          @let chip = getUserTypeChip(row.type);

          <app-status-chip
            [label]="chip.label"
            [tone]="chip.tone"
            [icon]="chip.icon ?? null"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef>Empresa</th>

        <td mat-cell *matCellDef="let row">
          <span class="company">
            {{ row.pmseCompany ?? '—' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>

        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button
            mat-icon-button
            type="button"
            matTooltip="Ver detalle"
          >
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      table-footer
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      showFirstLastButtons
    />
  </app-table-card>
</section>

<app-drawer-shell
  [open]="drawerOpen()"
  width="540px"
  (closed)="drawerOpen.set(false)">
  <app-create-user-drawer
    (created)="onUserCreated()"
    (closed)="drawerOpen.set(false)"
  />
</app-drawer-shell>
