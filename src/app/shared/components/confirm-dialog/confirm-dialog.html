<div class="dialog-wrap">
  <div class="dialog-icon" [class]="data.type ?? 'danger'">
    @if ((data.type ?? 'danger') === 'danger') {
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 2L20 19H2L11 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M11 9v4M11 15.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    }
    @if (data.type === 'warning') {
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="9" stroke="currentColor" stroke-width="1.8"/>
        <path d="M11 7v5M11 14.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    }
    @if (data.type === 'info') {
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="9" stroke="currentColor" stroke-width="1.8"/>
        <path d="M11 10v5M11 7.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    }
  </div>

  <h2 class="dialog-title">{{ data.title }}</h2>
  <p class="dialog-message">{{ data.message }}</p>

  <div class="dialog-actions">
    <button class="btn-cancel" (click)="cancel()">
      {{ data.cancelText ?? 'Cancelar' }}
    </button>
    <button class="btn-confirm" [class]="data.type ?? 'danger'" (click)="confirm()">
      {{ data.confirmText ?? 'Confirmar' }}
    </button>
  </div>
</div>
